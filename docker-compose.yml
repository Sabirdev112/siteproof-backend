services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: siteproof-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: siteproof
      POSTGRES_PASSWORD: siteproof
      POSTGRES_DB: siteproof
    ports:
      - "5432:5432"
    volumes:
      - siteproof_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siteproof -d siteproof"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  siteproof_pgdata:
